name: Update prices and publish

on:
  schedule:
    # UTC. Riga is UTC+2 in winter, UTC+3 in summer.
    - cron: "30 4 * * *"
    - cron: "45 5 * * *"
    - cron: "15 6 * * *"
    - cron: "30 9,13,17 * * *"
  workflow_dispatch:
  push:
    branches: [main, redesign]
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Parser tests
        run: python -m unittest discover -s tests
      - name: Collect prices
        id: scrape
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/scrape.py
      - name: Commit data
        run: |
          git config user.name "radars-bot"
          git config user.email "radars-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest icons data _site/
      - name: Build preview from the redesign branch (published at /next/)
        run: |
          if git ls-remote --exit-code --heads origin redesign >/dev/null 2>&1; then
            git fetch --depth 1 origin redesign
            mkdir -p _site/next
            git archive FETCH_HEAD | tar -x -C _site/next
            rm -rf _site/next/scripts _site/next/tests _site/next/.github _site/next/README.md _site/next/data
            cp -r data _site/next/data
            echo "preview published at /next/"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Fail the run if collecting prices failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "scripts/scrape.py failed; the site was published with the previous data"
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
